name: ace-step-forge-m1

services:
  forge:
    # The UI edge is ARM64; the API and MCP run natively on this same Mac
    # with MPS/MLX and are reached through Docker Desktop's host gateway.
    platform: linux/arm64
    image: ${FORGE_IMAGE:-ghcr.io/sunwood-ai-labs/ace-step-forge-ui:main}
    container_name: ace-step-forge-ui
    environment:
      # host:port only; the image's Nginx proxy adds http://.
      FORGE_API_UPSTREAM: ${FORGE_API_UPSTREAM:-host.docker.internal:8001}
    ports:
      # 3000 is commonly occupied by local developer tools on macOS.
      - "${FORGE_PORT:-3003}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
