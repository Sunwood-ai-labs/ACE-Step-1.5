server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Keep the browser on a single origin while forwarding to the ACE-Step API.
    location /api/ {
        # Docker's internal resolver lets Forge start even while the API is
        # restarting; requests return a normal proxy error until it is ready.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $acestep_upstream acestep:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$acestep_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
